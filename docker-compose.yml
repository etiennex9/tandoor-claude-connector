name: tandoor-claude

services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    # Only nginx on this host should reach the gateway.
    ports:
      - "127.0.0.1:8737:8000"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OIDC_CONFIG_URL: ${OIDC_CONFIG_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Passed through to the tandoor-recipes-mcp child process.
      TANDOOR_URL: ${TANDOOR_URL}
      TANDOOR_TOKEN: ${TANDOOR_TOKEN}
      # Tool lists: empty means the curated defaults in gateway/server.py (see README).
      TANDOOR_MCP_INCLUDE_ONLY: ${TANDOOR_MCP_INCLUDE_ONLY:-}
      TANDOOR_MCP_EXCLUDE: ${TANDOOR_MCP_EXCLUDE:-}
    volumes:
      # OAuth client registrations and encrypted upstream tokens.
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Every 2s until the first success (or 30s), so the app shows as healthy right after it starts.
      start_period: 30s
      start_interval: 2s

volumes:
  gateway-data:
