# Tests the gateway, then builds its image when its inputs changed (see .github/scripts/image-changed.sh) and starts it
# (.github/scripts/smoke-test.sh). On main, pushes it to ghcr.io/<owner>/tandoor-claude-gateway, tagged latest and
# sha-<commit>. A manual run on another branch pushes only sha-<commit>.
name: Publish

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      # The image's python3 is Debian bookworm's.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compared with the pull request's base, or on main with the last successful push run, so that the changes of a
      # canceled or failed run are built by the next one. Pull request runs don't count: one from a fork's main is listed
      # under main too, and its head would hide the merged changes. A manual run always builds.
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push) last=$(gh run list --workflow publish.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
                  range="${last:+$last..HEAD}" ;;
            *) range="" ;;
          esac
          build=$(bash .github/scripts/image-changed.sh "$range")
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tandoor-claude-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: gateway
          load: true
          tags: tandoor-claude-gateway:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      # Starts the image as TrueNAS and compose run it, and with a root-owned /data, where it must stop with a message.
      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh tandoor-claude-gateway:smoke
      # The same build again, from the builder's cache.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
