# Add these two location blocks inside your EXISTING HTTPS `server { ... }` block
# for your Tandoor host. Everything else keeps going to Tandoor.

# Gateway: /claude/mcp, /claude/authorize, /claude/token, /claude/register,
# /claude/auth/callback, /claude/consent, ...
# The trailing slash on proxy_pass strips the /claude prefix.
location /claude/ {
    proxy_pass http://127.0.0.1:8737/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # MCP responses can be streamed (SSE); don't buffer or time them out early.
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
}

# OAuth discovery must live at the host root:
#   /.well-known/oauth-protected-resource/claude/mcp
#   /.well-known/oauth-authorization-server
# No trailing slash on proxy_pass here: the path is passed through unchanged.
location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:8737;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optional hardening: only Anthropic's servers ever call the MCP endpoint
# itself (your browser only visits /claude/authorize, /claude/consent and
# /claude/auth/callback during sign-in). Uncomment to restrict it.
#
# location = /claude/mcp {
#     allow 160.79.104.0/21;
#     deny  all;
#     proxy_pass http://127.0.0.1:8737/mcp;
#     proxy_http_version 1.1;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
